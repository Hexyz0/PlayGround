<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Hollow Crown: Skirmish — a tiny turn-based tactics game made for phones." />
  <title>Hollow Crown — Skirmish</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ============ HOME ============ -->
    <section id="home" class="screen active" aria-label="Main menu">
      <div class="home-glow" aria-hidden="true"></div>
      <div class="home-inner">
        <div class="crest" aria-hidden="true">
          <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 62 L12 30 L30 42 L48 18 L66 42 L84 30 L78 62 Z" />
            <path d="M22 70 H74" stroke-linecap="round" />
            <path d="M30 78 H66" stroke-linecap="round" opacity=".45" />
          </svg>
        </div>
        <p class="kicker">A TINY TACTICS TALE</p>
        <h1>HOLLOW<br /><span>CROWN</span></h1>
        <p class="tagline">Five fights. Three heroes.<br />One empty throne.</p>
        <nav class="menu" aria-label="Main menu">
          <button id="btn-continue" class="btn primary" disabled>Continue</button>
          <button id="btn-new" class="btn">New Run</button>
          <button id="btn-how" class="btn ghost">How to Play</button>
        </nav>
        <p class="foot">TAP &middot; MOVE &middot; STRIKE</p>
      </div>
    </section>

    <!-- ============ BATTLE ============ -->
    <section id="battle" class="screen" aria-label="Battle">
      <header class="hud">
        <button id="btn-menu" class="icon-btn" aria-label="Pause menu">&#9776;</button>
        <div class="hud-mid">
          <span id="hud-stage">STAGE 1 / 5</span>
          <strong id="hud-name">The Ashen Gate</strong>
        </div>
        <button id="btn-sound" class="icon-btn" aria-label="Toggle sound">&#9834;</button>
      </header>

      <div class="objective">
        <span id="hud-objective">Slay all foes</span>
        <span id="hud-turn">Turn 1</span>
      </div>

      <div class="battle-body">
        <div id="board-wrap" class="board-wrap">
          <canvas id="board" aria-label="Battle grid"></canvas>
          <div id="banner" class="banner" aria-live="polite"></div>
          <div id="hint" class="hint">Tap a hero</div>
          <div id="toast" class="toast" aria-live="polite"></div>
        </div>

        <div class="battle-side">
          <div id="unit-strip" class="unit-strip" aria-label="Your company"></div>
          <div class="controls">
            <button id="btn-done" class="btn ghost" disabled>Done</button>
            <button id="btn-end" class="btn primary">End Turn</button>
          </div>
        </div>
      </div>
    </section>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
